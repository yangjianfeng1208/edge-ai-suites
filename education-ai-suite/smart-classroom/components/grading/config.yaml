pipeline:
  # Processing steps control
  skip_subjective: false       # Skip subjective grading (VLM-based)
  skip_objective: false         # Skip objective grading (rule-based)
  skip_ocr: false             # Skip OCR if results already exist
  subjective_use_rubric: false        # Use rubric for subjective grading (if false, use free-form VLM)
  debug_mode: true             # Enable debug mode (saves intermediate results)
  # PDF rendering
  pdf_render_dpi: 300         # DPI for PDF rendering (higher = better quality, slower)

ocr:
  use_cached: false
  save_pdf_images: true
  pdf_dpi: 50
  max_pixels: 10000000
  max_tokens: 4096

  # Image processing optimization (speed vs quality balance)
  jpeg_quality: 85          # JPEG quality (60-95), lower=faster
  resize_ratio: 0.6        # Resize ratio (e.g., 0.5 for 50% size), null=no resize
  max_image_width: null     # Max image width in pixels, null=no limit
  max_image_height: null    # Max image height in pixels, null=no limit
  max_image_pixels: 4000000    # Max total pixels (overrides pdf max_pixels), null=use max_pixels
  enhance_contrast: null    # Contrast enhancement (1.0=no change, 1.2=+20%), null=no enhancement
  enhance_sharpness: null   # Sharpness enhancement (1.0=no change, 1.5=sharper), null=no enhancement

detection_service:
  # Detection filtering and processing (consumed by _run_layout_detection)
  target_labels: ["text", "display_formula", "table",
                  "title", "doc_title", "paragraph_title",
                  "aside_text", "vertical_text",
                  "formula_number"
                 ]      # Labels to detect: text, table, image, display_formula, etc.
  min_score: 0.5               # Minimum confidence score (0-1)
  sort_boxes: true             # Sort boxes top-to-bottom
  expand_margin: 10            # Expand box margins in pixels
  merge_overlapping: false     # Merge overlapping boxes
  iou_threshold: 0.7           # IoU threshold for merging (if enabled)
  save_visualizations: true    # Save images with detection boxes drawn

# Question parsing configuration
question_parsing:
  # Section titles to skip (instruction sections that are not questions)
  instruction_section_keywords:
    - "考试说明"
    - "注意事项"
    - "考生注意"
    - "答题要求"
    - "考场规则"
    - "作答须知"
    - "填写说明"
    - "instructions"
    - "directions"
    - "notice"

  # Question number patterns (regex, anchored at start of an OCR region).
  # First capture group must be the question number. Put all language-specific
  # characters here rather than in code.
  question_patterns:
    numbered:       "^\\s*(\\d+)\\s*[\\.。、]"        # 19.  19。  19、
    numbered_paren: "^\\s*(\\d+)\\s*[）)]"            # 19)  19）
    parenthesized:  "^\\s*[（(]\\s*(\\d+)\\s*[）)]"   # (19) （19）
    with_prefix:    "^\\s*第\\s*(\\d+)\\s*题"         # 第19题

  # Separators appended after a question number when detecting the NEXT question
  # boundary in position strategy (e.g. "20." / "20、").
  question_number_separators: [".", "．", "。", "、", ")", "）"]

# target_labels reference (all supported labels):
# text, table, image, display_formula, inline_formula, chart,
# title, doc_title, paragraph_title, figure_title,
# header, footer, header_image, footer_image,
# abstract, reference, reference_content, footnote, vision_footnote,
# algorithm, content, aside_text, vertical_text, seal, number, formula_number
