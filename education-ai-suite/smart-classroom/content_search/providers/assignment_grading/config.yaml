pipeline:
  # Exam configuration (can be overridden by command line arguments)
  rubric_dir: "./test_data/2025_sh_zhongkao_math/rubric_guided_scoring"  # Answer key and grading rubrics (shared by all students)
  papers_dir: "./test_data/2025_sh_zhongkao_math/papers"                 # Directory containing all student papers (student1/, student2/, ...)

  # Processing steps control
  skip_subjective: false       # Skip subjective grading (VLM-based)
  skip_objective: false       # Skip objective grading (rule-based)
  skip_ocr: false             # Skip OCR if results already exist

  # PDF rendering
  pdf_render_dpi: 300         # DPI for PDF rendering (higher = better quality, slower)

ocr:
  use_cached: false
  save_pdf_images: true
  pdf_dpi: 50
  max_pixels: 10000000
  max_tokens: 4096

  # Image processing optimization (speed vs quality balance)
  jpeg_quality: 85          # JPEG quality (60-95), lower=faster
  resize_ratio: null        # Resize ratio (e.g., 0.5 for 50% size), null=no resize
  max_image_width: null     # Max image width in pixels, null=no limit
  max_image_height: null    # Max image height in pixels, null=no limit
  max_image_pixels: null    # Max total pixels (overrides pdf max_pixels), null=use max_pixels
  enhance_contrast: null    # Contrast enhancement (1.0=no change, 1.2=+20%), null=no enhancement
  enhance_sharpness: null   # Sharpness enhancement (1.0=no change, 1.5=sharper), null=no enhancement

vlm_service:
  base_url: "http://127.0.0.1:9900"
  timeout: 300
  max_retries: 2

ocr_service:
  base_url: "http://127.0.0.1:9901"
  timeout: 300
  max_retries: 2

detection_service:
  base_url: "http://127.0.0.1:9902"
  timeout: 300
  max_retries: 2

  # Detection filtering and processing
  target_labels: ["text", "display_formula", "table", 
                  "title", "doc_title", "paragraph_title", 
                  "aside_text", "vertical_text",
                  "formula_number"
                 ]      # Labels to detect: text, table, image, display_formula, etc.
  min_score: 0.5               # Minimum confidence score (0-1)
  sort_boxes: true             # Sort boxes top-to-bottom
  expand_margin: 10            # Expand box margins in pixels
  merge_overlapping: false     # Merge overlapping boxes
  iou_threshold: 0.7           # IoU threshold for merging (if enabled)

  # Visualization
  save_visualizations: true    # Save images with detection boxes drawn

